

pushpull:
  class:     'PushPullGenerator'
  nmodes:     702
  vect_amplitude_data:  'pushpull_1139modes_amp50'
  outputs: ['output']

main_override:
  total_time:  1.404

prop_override:
  inputs:
    common_layer_list: ['pupilstop',
                  'dm.out_layer']

source_ngs_override:
  polar_coordinates:  [0.0, 0.0]         # [arcsec, degrees] source polar coordinates
  magnitude:         7.0  

dm_override:
  sign: 1
  inputs:
      in_command: 'pushpull.output'


detector_override:
  photon_noise:      False
  readout_noise:     False
  excess_noise:      False


im_calibrator_lo:
  class: 'ImCalibrator'
  nmodes: 702
  im_tag:     'eris_im_test'
  overwrite: True
  inputs:
    in_slopes: 'slopec.out_slopes'
    in_commands: 'pushpull.output'
  outputs: ['out_intmat']


rec_calibrator_lo:
  class: 'RecCalibrator'
  nmodes: 702
  rec_tag:     'eris_rec_test'
  overwrite: True
  inputs:
    in_intmat: 'im_calibrator_lo.out_intmat'


remove: ['atmo','modalrec','integrator','psf']
